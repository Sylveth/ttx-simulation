<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>能源安全情境推演</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fa;--surface:#fff;--surface2:#f1f3f5;
  --border:rgba(0,0,0,0.09);--border-s:rgba(0,0,0,0.2);
  --text:#1a1a2e;--muted:#555770;--dim:#9a9aaa;
  --accent:#c97b0a;--accent-d:rgba(201,123,10,0.08);--accent-b:rgba(201,123,10,0.32);
  --green:#2a7a3b;--green-d:rgba(42,122,59,0.08);--green-b:rgba(42,122,59,0.28);
  --red:#c0392b;
  --ca:#2255bb;--ca-d:rgba(34,85,187,0.08);--ca-b:rgba(34,85,187,0.28);
  --cb:#6b3fa0;--cb-d:rgba(107,63,160,0.08);--cb-b:rgba(107,63,160,0.28);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;font-size:15px}
.header{padding:12px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(247,248,250,0.96);backdrop-filter:blur(8px);z-index:20;display:flex;align-items:center;justify-content:space-between}
.header-title{font-family:'Noto Serif TC',serif;font-size:14px;color:var(--accent)}
.header-r{display:flex;align-items:center;gap:10px}
.conn{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green);animation:pulse 2s infinite}
.conn.red{background:var(--red);box-shadow:0 0 5px var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.back-btn{font-size:12px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:4px;padding:3px 9px;cursor:pointer;font-family:'Noto Sans TC',sans-serif}
.back-btn:hover{border-color:var(--border-s);color:var(--text)}
.main{max-width:620px;margin:0 auto;padding:24px 16px 80px}

/* welcome */
.welcome-hero{text-align:center;padding:36px 0 24px}
.welcome-title{font-family:'Noto Serif TC',serif;font-size:22px;color:var(--accent);line-height:1.45;margin-bottom:8px}
.welcome-sub{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:28px}

/* step label */
.step-lbl{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* group selection */
.group-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.group-btn{padding:22px 16px;border-radius:10px;border:2px solid var(--border);background:var(--surface);cursor:pointer;text-align:center;transition:all .14s;font-family:'Noto Sans TC',sans-serif}
.group-btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.group-btn.gpa{border-top:4px solid var(--ca)}
.group-btn.gpa:hover{border-color:var(--ca-b);background:var(--ca-d)}
.group-btn.gpb{border-top:4px solid var(--cb)}
.group-btn.gpb:hover{border-color:var(--cb-b);background:var(--cb-d)}
.gb-icon{font-size:32px;display:block;margin-bottom:8px}
.gb-name{font-size:16px;font-weight:500;margin-bottom:4px}
.gb-desc{font-size:11px;color:var(--muted);line-height:1.5}

/* recorder selection */
.recorder-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.recorder-btn{padding:18px 8px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;text-align:center;transition:all .13s;font-family:'Noto Sans TC',sans-serif}
.recorder-btn:hover{border-color:var(--border-s);background:var(--surface2)}
.recorder-btn.gpa-r:hover,.recorder-btn.gpa-r.active{border-color:var(--ca-b);background:var(--ca-d)}
.recorder-btn.gpb-r:hover,.recorder-btn.gpb-r.active{border-color:var(--cb-b);background:var(--cb-d)}
.r-num{font-size:26px;font-weight:600;display:block;margin-bottom:4px}
.r-lbl{font-size:12px;color:var(--muted)}
.r-done{font-size:10px;color:var(--green);margin-top:3px}

/* identity bar */
.id-bar{padding:10px 14px;border-radius:8px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.id-bar.gpa{background:var(--ca-d);border:1px solid var(--ca-b)}
.id-bar.gpb{background:var(--cb-d);border:1px solid var(--cb-b)}
.id-bar-icon{font-size:18px}
.id-bar-name{font-size:14px;font-weight:500}
.id-bar-rec{font-size:12px;color:var(--muted)}
.tag{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:500;letter-spacing:.05em}
.tag-o{background:var(--accent-d);color:var(--accent);border:1px solid var(--accent-b)}
.tag-a{background:var(--ca-d);color:var(--ca);border:1px solid var(--ca-b)}
.tag-b{background:var(--cb-d);color:var(--cb);border:1px solid var(--cb-b)}

/* scenario */
.scenario-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:14px;overflow:hidden}
.scenario-hd{padding:9px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px}
.scenario-bd{padding:14px;font-size:14px;line-height:1.85;white-space:pre-wrap}

/* pushed cards */
.pushed-card{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:7px}
.pc-hd{font-size:12px;font-weight:500;margin-bottom:3px}
.pc-body{font-size:13px;color:var(--muted);line-height:1.6}

/* input */
.input-hint{font-size:12px;color:var(--accent);background:var(--accent-d);border:1px solid var(--accent-b);border-radius:5px;padding:8px 11px;margin-bottom:10px;line-height:1.6}
textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px;color:var(--text);font-family:'Noto Sans TC',sans-serif;font-size:15px;line-height:1.75;resize:vertical;min-height:140px;transition:border-color .12s}
textarea:focus{outline:none;border-color:var(--accent-b)}
textarea::placeholder{color:var(--dim)}
.char-c{text-align:right;font-size:11px;color:var(--dim);margin-top:3px;margin-bottom:12px}
.btn-sub{width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:6px;font-family:'Noto Sans TC',sans-serif;font-size:16px;font-weight:500;cursor:pointer;transition:all .12s}
.btn-sub:hover{background:#e08c14}

/* submitted */
.alert-ok{padding:10px 14px;border-radius:5px;font-size:13px;margin-bottom:12px;background:var(--green-d);border:1px solid var(--green-b);color:var(--green)}
.submitted-box{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:12px 14px;margin-bottom:10px}
.submitted-lbl{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.submitted-text{font-size:14px;line-height:1.8;white-space:pre-wrap}
.sub-time{font-size:11px;color:var(--dim);margin-top:6px}
.btn-edit{width:100%;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--muted);font-family:'Noto Sans TC',sans-serif;font-size:13px;cursor:pointer;margin-bottom:10px}
.btn-edit:hover{border-color:var(--border-s);color:var(--text)}

/* AI panel */
.ai-panel{background:var(--surface);border:1px solid rgba(107,63,160,.3);border-radius:8px;overflow:hidden;margin-bottom:14px}
.ai-hd{padding:9px 14px;background:rgba(107,63,160,.07);border-bottom:1px solid rgba(107,63,160,.18);font-size:12px;color:#6b3fa0;font-weight:500}
.ai-bd{padding:13px 14px;font-size:13px;line-height:1.85;white-space:pre-wrap}

/* member input */
.member-input-row{display:grid;grid-template-columns:72px 1fr;align-items:start;border-bottom:1px solid var(--border)}
.member-input-row:last-of-type{border-bottom:none}
.member-name-lbl{padding:10px 8px 10px 0;font-size:13px;font-weight:500;color:var(--muted);line-height:1.4;word-break:break-all}
.member-input-row textarea{border:none;border-left:1px solid var(--border);border-radius:0;padding:8px 10px;resize:vertical;min-height:60px;background:transparent;font-size:13px;line-height:1.65}

/* waiting / end */
.waiting{text-align:center;padding:32px 20px;color:var(--muted);font-size:13px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.final{text-align:center;padding:48px 20px}
.final-title{font-size:20px;font-weight:500;color:var(--accent);margin-bottom:8px}
</style>
</head>
<body>
<div class="header">
  <div class="header-title">地緣政治下的能源安全</div>
  <div class="header-r">
    <button class="back-btn" id="backBtn" style="display:none" onclick="goBack()">← 重新選擇</button>
    <div class="conn" id="connDot"></div>
  </div>
</div>
<div class="main" id="app">
  <div class="waiting"><div class="spinner"></div>載入中...</div>
</div>

<script>
const FB = 'https://ttxproject-382cf-default-rtdb.asia-southeast1.firebasedatabase.app/ttx-session-v3.json';
const POLL = 3000;

const GROUPS = {
  a: { key:'a', name:'技術解方', icon:'⚙️', cls:'gpa', tag:'tag-a', desc:'' },
  b: { key:'b', name:'社會網絡', icon:'🏛️', cls:'gpb', tag:'tag-b', desc:'' },
};

const PHASE_LABELS = ['','情境一：停電12小時','情境二：停電三天','情境三：停電七天','尾聲'];

async function getState(){
  try{
    const r=await fetch(FB+'?_='+Date.now(),{cache:'no-store'});
    document.getElementById('connDot').classList.remove('red');
    return await r.json()||defaultState();
  }catch{ document.getElementById('connDot').classList.add('red'); return null; }
}
async function putState(s){ await fetch(FB,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(s)}); }
function defaultState(){ return {phase:1,submissions:{},scenario:'',aiSummary:null,aiHistory:[],pushedCards:[]}; }

let myId = null;
let editing = false;
let lastHash = '';

const MEMBERS = {
  a:['顏哲淵','余宸瑋','劉家銘','呂學儒','李孟穎','羅慶權','郭錦程','鄭智文','陳正一','黃偉哲'],
  b:['侯家楷','侯彥隆','徐立基','杜威達','潘旻真','許仁澤','黃品涵','黃龍冠','阿布娪','林彥廷'],
};
const REC_ROLES = {
  a:['電力資源調度的結論','電力調度過程中的障礙'],
  b:['滿足不同區域電力需求的優先順序與決策考量','協調相關電力資源與電力需求時遇到的障礙'],
};

const groupOfId  = id => id ? GROUPS[id.split('-')[0]] : null;
const recNumOfId = id => id ? id.split('-')[1] : null;

/* ── Scenario cards ── */
const SCENARIO_CARDS=[
  {cat:'電力基礎設施',icon:'⚡',cards:[
    {id:'sc_power_ext',title:'電力中斷延長',text:'主幹線修復進度落後，預估停電時間延長至72小時以上，備援電力設備陸續告竭。'},
    {id:'sc_solar_dmg',title:'太陽能板損毀',text:'颱風導致區域內多處屋頂型太陽能板受損，分散式電源進一步減少。'},
    {id:'sc_stor_dep', title:'儲能系統耗盡',text:'各節點儲能系統連續供電後電量告急，部分節點已降至20%以下。'},
    {id:'sc_sub_flood',title:'變電站進水',  text:'七股主要配電變電站積水，技術人員無法進入作業，影響大範圍復電時程。'},
    {id:'sc_line_brk', title:'輸電線路斷線',text:'新增2處輸電線路斷點確認，台電需重新評估孤島運轉範圍。'},
  ]},
  {cat:'通訊與資訊',icon:'📡',cards:[
    {id:'sc_bts_down', title:'基地台斷電',   text:'後壁里、西港里共5座基地台備援電力耗盡，當地通訊全面中斷。'},
    {id:'sc_sat_jam',  title:'衛星網路壅塞', text:'區域內衛星網路使用量激增，頻寬嚴重壅塞，緊急通訊受到影響。'},
    {id:'sc_rumor',    title:'謠言擴散',     text:'社群媒體出現多則未查核消息，聲稱儲能設備起火，引發民眾恐慌。'},
    {id:'sc_radio_jam',title:'無線電頻道壅塞',text:'緊急無線電頻道因使用者過多而壅塞，現場協調效率大幅下降。'},
  ]},
  {cat:'交通與物流',icon:'🚧',cards:[
    {id:'sc_road_flood',title:'道路淹水封閉',text:'台19線七股段持續積水，預計24小時內無法恢復通行，重要物資滯留外圍。'},
    {id:'sc_bridge',   title:'橋梁封閉',    text:'七股溪橋梁結構受損，禁止重型車輛通行，大型設備無法運入。'},
    {id:'sc_cargo',    title:'物資車無法入區',text:'3輛載有柴油與緊急物資的車輛在檢查站等候超過4小時，通關程序仍未完成。'},
    {id:'sc_fuel',     title:'燃料短缺',    text:'區域內柴油存量預計在12小時內耗盡，補給車隊仍在調度中。'},
    {id:'sc_port',     title:'港口設施受損',text:'將軍漁港部分碼頭受損，漁船無法出海，水上補給路線受阻。'},
  ]},
  {cat:'民生社區',icon:'🏘',cards:[
    {id:'sc_evac',    title:'居民自行撤離', text:'部分里民不願等待政府安排開始自行撤離，造成道路更加擁擠。'},
    {id:'sc_elderly', title:'獨居長者失聯', text:'社區關懷協會回報，12名獨居長者在前次聯繫後失去聯絡，位置不明。'},
    {id:'sc_shelter', title:'收容所電力不足',text:'七股國中收容所收容人數超過預估3倍，備用電力僅能維持基本照明6小時。'},
    {id:'sc_water',   title:'飲用水污染',  text:'社區自來水管線破損，衛生局警告暫停飲用，瓶裝水需求暴增。'},
    {id:'sc_protest', title:'民眾聚集抗議', text:'約百名養殖業者聚集台南市政府前，要求立即啟動電力優先序並賠償損失。'},
  ]},
  {cat:'漁電共生',icon:'🐟',cards:[
    {id:'sc_oxygen',   title:'養殖池打氧停擺',text:'七股區養殖池打氧系統停擺已超過8小時，虱目魚開始大量死亡，損失無法挽回。'},
    {id:'sc_gen_fight',title:'漁民搶接發電機',text:'有限的發電機資源引發業者間搶奪，數起口角衝突已通報警察局。'},
    {id:'sc_solar_biz',title:'太陽能業者介入',text:'漁電共生太陽能業者聲稱對其設備有優先使用權，拒絕讓步給養殖業者。'},
    {id:'sc_cold_chain',title:'冷鏈中斷',   text:'冷凍倉庫備援電力耗盡，冷鏈完全中斷，水產品損失估計超過千萬元。'},
  ]},
  {cat:'行政協調',icon:'🏛',cards:[
    {id:'sc_gov_blk',  title:'跨機關決策卡關',text:'孤島運轉授權在能源署與台電之間來回確認，已超過6小時仍未取得裁示。'},
    {id:'sc_resources',title:'外部資源抵達', text:'台電中區緊急支援隊12人與移動式變壓器2台抵達外圍，等候指揮調度。'},
    {id:'sc_media',    title:'媒體進入災區', text:'多家媒體記者進入災區採訪，部分現場操作因受鏡頭干擾而減緩。'},
    {id:'sc_budget',   title:'預算核撥延遲', text:'地方政府緊急採購燃料的預算申請卡在主計單位，需要額外審批程序。'},
  ]},
];
function findCard(cid){ for(const cat of SCENARIO_CARDS){ const c=cat.cards.find(x=>x.id===cid); if(c) return c; } return null; }


/* ── Render ── */
function render(s){
  if(!myId) { renderStep1(s); return; }
  if(s.phase>=4){ renderEnd(); return; }
  renderInput(s);
}

/* Step 1: choose group */
function renderStep1(s){
  document.getElementById('app').innerHTML=`
    <div class="welcome-hero">
      <div class="welcome-title">地緣政治下的能源安全<br>情境模擬工作坊</div>
      <div class="welcome-sub">颱風重創臺南七股<br>請先選擇你的組別</div>
    </div>
    <div class="step-lbl">STEP 1 — 選擇組別</div>
    <div class="group-btns">
      ${Object.values(GROUPS).map(g=>`
      <button class="group-btn ${g.cls}" onclick="selectGroup('${g.key}')">
        <span class="gb-icon">${g.icon}</span>
        <div class="gb-name">${g.name}</div>
      </button>`).join('')}
    </div>`;
}

/* Step 2: choose recorder number */
function renderStep2(groupKey, s){
  const g = GROUPS[groupKey];
  const subs = s.submissions||{};
  document.getElementById('app').innerHTML=`
    <div class="id-bar ${g.cls}">
      <span class="id-bar-icon">${g.icon}</span>
      <span class="id-bar-name">${g.name}</span>
    </div>
    <div class="step-lbl">STEP 2 — 選擇你負責的記錄項目</div>
    <div class="recorder-btns">
      ${[1,2].map(n=>{
        const subId=`${groupKey}-${n}`;
        const done=!!subs[subId];
        const role=REC_ROLES[groupKey][n-1];
        return `<button class="recorder-btn ${g.cls}-r${done?' active':''}" onclick="selectRecorder('${groupKey}',${n})">
          <span class="r-lbl">${role}</span>
          ${done?`<div class="r-done">✓ 已填寫</div>`:''}
        </button>`;
      }).join('')}
    </div>
    <div style="margin-top:16px">
      <button class="back-btn" style="display:inline-block" onclick="clearGroupChoice()">← 換組別</button>
    </div>`;
}

/* Main input */
function renderInput(s){
  const g = groupOfId(myId);
  const n = parseInt(recNumOfId(myId));
  const gk = myId.split('-')[0];
  const members = MEMBERS[gk];
  const mySub = s.submissions?.[myId];
  const myData = mySub?.data||{};
  const scenario = s.scenario||'';
  const phaseLabel = PHASE_LABELS[s.phase]||'';

  let html='';

  html+=`<div class="id-bar ${g.cls}">
    <span class="id-bar-icon">${g.icon}</span>
    <span class="id-bar-name">${g.name}</span>
    <span class="id-bar-rec">${REC_ROLES[gk][n-1]}</span>
    <span class="tag ${g.tag}" style="margin-left:auto">${phaseLabel||'準備中'}</span>
  </div>`;

  if(s.aiSummary){
    html+=`<div class="ai-panel"><div class="ai-hd">✦ AI 分析 — 本回合摘要</div><div class="ai-bd">${s.aiSummary}</div></div>`;
  }
  if(scenario){
    html+=`<div class="scenario-card"><div class="scenario-hd"><span class="tag tag-o">${phaseLabel}</span>本回合情境</div><div class="scenario-bd">${scenario}</div></div>`;
  }
  if(mySub && !editing){
    // Submitted view
    const t=new Date(mySub.time);
    const ts=`${t.getHours().toString().padStart(2,'0')}:${t.getMinutes().toString().padStart(2,'0')}`;
    html+=`<div class="alert-ok">✓ ${REC_ROLES[gk][n-1]} 已送出（${ts}）</div>`;
    html+=`<div class="member-input-row" style="font-size:11px;color:var(--dim);font-weight:500;padding:4px 0;border-bottom:2px solid var(--border)"><span>成員</span><span style="padding-left:10px">記錄內容</span></div>`;
    members.forEach(name=>{
      const text=myData[name]||'';
      html+=`<div class="member-input-row"><div class="member-name-lbl">${name}</div><div style="padding:8px 10px;font-size:13px;line-height:1.65;white-space:pre-wrap;color:${text?'var(--fg)':'var(--dim)'}">${text||'—'}</div></div>`;
    });
    html+=`<button class="btn-edit" onclick="startEdit()">✏️ 修改記錄</button>`;
  } else {
    // Input view
    html+=`<div class="input-hint">📝 在每位成員旁邊記錄他們的發言重點或行動觀察，可只填部分人。</div>`;
    html+=members.map(name=>`<div class="member-input-row">
      <div class="member-name-lbl">${name}</div>
      <textarea id="mi_${name}" placeholder="${name}..." style="min-height:60px">${myData[name]||''}</textarea>
    </div>`).join('');
    html+=`<button class="btn-sub" style="margin-top:14px" onclick="submitAnswer()">送出記錄</button>`;
  }

  document.getElementById('app').innerHTML=html;
}

function renderEnd(){
  document.getElementById('app').innerHTML=`
    <div class="final">
      <div style="font-size:36px;margin-bottom:12px">🎯</div>
      <div class="final-title">推演完成</div>
      <div style="font-size:13px;color:var(--muted);margin-top:8px">感謝你的參與！</div>
    </div>`;
}

/* ── Actions ── */
let pendingGroup = null;

function selectGroup(groupKey){
  pendingGroup = groupKey;
  getState().then(s=>{ if(s) renderStep2(groupKey, s); });
}

function clearGroupChoice(){
  pendingGroup = null;
  getState().then(s=>{ if(s) renderStep1(s); });
}

function selectRecorder(groupKey, n){
  myId = `${groupKey}-${n}`;
  pendingGroup = null;
  sessionStorage.setItem('ttx-id-v3', myId);
  document.getElementById('backBtn').style.display='';
  getState().then(s=>{ if(s) render(s); });
}

function goBack(){
  if(!confirm('確定要重新選擇？')) return;
  myId=null; pendingGroup=null; editing=false;
  sessionStorage.removeItem('ttx-id-v3');
  document.getElementById('backBtn').style.display='none';
  getState().then(s=>{ if(s) renderStep1(s); });
}

function startEdit(){ editing=true; getState().then(s=>{ if(s) renderInput(s); }); }

function updateChar(el){ const c=document.getElementById('charC'); if(c) c.textContent=`${el.value.length} 字`; }

async function submitAnswer(){
  const gk=myId.split('-')[0];
  const members=MEMBERS[gk];
  const data={};
  let hasAny=false;
  members.forEach(name=>{
    const val=document.getElementById(`mi_${name}`)?.value.trim()||'';
    if(val){data[name]=val;hasAny=true;}
  });
  if(!hasAny){alert('請至少填寫一位成員的記錄');return;}
  const subFB=FB.replace('.json',`/submissions/${myId}.json`);
  await fetch(subFB,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({time:Date.now(),data})});
  editing=false;
  const s=await getState();
  if(s) render(s);
}

/* ── Poll ── */
async function poll(){
  const s=await getState(); if(!s) return;

  // If on step 2 (recorder selection), refresh recorder status
  if(pendingGroup){
    const newSubs=JSON.stringify(
      [1,2].map(n=>!!s.submissions?.[`${pendingGroup}-${n}`])
    );
    if(newSubs!==lastHash){ lastHash=newSubs; renderStep2(pendingGroup,s); }
    return;
  }

  if(!myId) return;
  const h=JSON.stringify({ph:s.phase,sub:s.submissions?.[myId],ai:s.aiSummary,pushed:s.pushedCards});
  if(h===lastHash) return;
  lastHash=h;
  const active=document.activeElement;
  if(active && active.tagName==='TEXTAREA') return;
  render(s);
}

/* ── Init ── */
async function init(){
  const s=await getState();
  if(!s){ document.getElementById('app').innerHTML=`<div class="waiting">無法連線，請重新整理頁面</div>`; return; }
  const saved=sessionStorage.getItem('ttx-id-v3');
  if(saved && (saved.startsWith('a-')||saved.startsWith('b-'))){
    myId=saved;
    document.getElementById('backBtn').style.display='';
  }
  render(s);
  setInterval(poll,POLL);
}
init();
</script>
